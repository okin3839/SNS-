<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ページタイトル -->
    <title>新規アカウント登録 - SNS掲示板</title>
    <!-- Bootstrap 5 CSS の読み込み -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<!-- メインコンテナ（画面中央にカードを配置） -->
<div class="container" style="max-width: 400px;">
    <!-- ロゴ・タイトル -->
    <h2 class="text-center mb-4 fw-bold text-primary">SNS掲示板</h2>

    <!-- アカウント登録カード -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4 fw-bold">アカウント新規登録</h4>

            <!-- 登録フォーム（Userオブジェクトにバインドして /register へPOST送信） -->
            <form th:action="@{/register}" method="post" th:object="${user}">

                <!-- ニックネーム（ユーザー名）入力項目 -->
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">ニックネーム：</label>
                    <input type="text" th:field="*{username}" class="form-control form-control-lg bg-light" placeholder="例: 太郎">
                    <!-- ニックネームのバリデーションエラーメッセージ（未入力・重複チェック結果など） -->
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger mt-1 small"></div>
                </div>

                <!-- パスワード入力項目 -->
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">パスワード：</label>
                    <input type="password" th:field="*{password}" class="form-control form-control-lg bg-light">
                    <!-- パスワードのバリデーションエラーメッセージ（未入力・文字数制限など） -->
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger mt-1 small"></div>
                </div>

                <!-- 送信ボタン -->
                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill mb-3">登録する</button>
            </form>

            <hr class="text-muted">

            <!-- タイムライン画面への戻りリンク -->
            <div class="text-center">
                <a href="/" class="text-decoration-none text-muted small">掲示板に戻る</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
