<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ページタイトル -->
    <title>ログイン - SNS掲示板</title>
    <!-- Bootstrap 5 CSS の読み込み -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<!-- ログインフォームエリア（中央配置・幅400px制限） -->
<div class="container" style="max-width: 400px;">
    <!-- アプリタイトル -->
    <h2 class="text-center mb-4 fw-bold text-primary">SNS掲示板</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4 fw-bold">ログイン</h4>

            <!-- ログイン失敗時のエラーメッセージ（URLに ?error が含まれる場合に表示） -->
            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                ユーザー名またはパスワードが違います。
            </div>

            <!-- ログアウト完了時のメッセージ（URLに ?logout が含まれる場合に表示） -->
            <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
                ログアウトしました。
            </div>

            <!-- ログイン処理フォーム（Spring Security デフォルトの /login へ POST 送信） -->
            <form th:action="@{/login}" method="post">
                <!-- ユーザー名（ニックネーム）入力欄 -->
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">ニックネーム：</label>
                    <input type="text" name="username" class="form-control form-control-lg bg-light" required>
                </div>
                <!-- パスワード入力欄 -->
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">パスワード：</label>
                    <input type="password" name="password" class="form-control form-control-lg bg-light" required>
                </div>
                <!-- ログイン実行ボタン -->
                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill mb-3">ログイン</button>
            </form>

            <hr class="text-muted">

            <!-- 会員登録画面への遷移リンク -->
            <div class="text-center">
                <a th:href="@{/register}" class="text-decoration-none text-muted small">アカウントの新規作成</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
