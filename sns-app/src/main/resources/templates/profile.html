<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ページタイトル -->
    <title>プロフィール設定 - SNS掲示板</title>
    <!-- Bootstrap 5 CSS の読み込み -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 上部ナビゲーションバー -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container" style="max-width: 800px;">
        <a class="navbar-brand fw-bold" href="/">SNS掲示板</a>
        <div class="d-flex align-items-center">
            <a href="/" class="btn btn-sm btn-outline-light me-3">タイムラインに戻る</a>
        </div>
    </div>
</nav>

<!-- メインコンテンツ領域（設定フォームと履歴一覧） -->
<div class="container pb-5" style="max-width: 800px;">

    <!-- ① プロフィール設定フォーム領域 -->
    <div class="card shadow-sm border-0 mx-auto mb-5" style="max-width: 500px;">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4 fw-bold">プロフィール設定</h4>

            <!-- 更新完了・エラー通知アラート表示 -->
            <div th:if="${param.success}" class="alert alert-success py-2" role="alert">
                更新しました
            </div>

            <div th:if="${param.sizeError}" class="alert alert-danger py-2" role="alert">
                画像サイズが大きすぎます。10MB以下のファイルを選択してください。
            </div>

            <div th:if="${param.duplicateError}" class="alert alert-danger py-2" role="alert">
                そのニックネームは既に他のユーザーに使われています。別の名前を入力してください。
            </div>

            <div th:if="${param.currentPasswordError}" class="alert alert-danger py-2" role="alert">
                現在のパスワードが間違っています。
            </div>

            <div th:if="${param.passwordMatchError}" class="alert alert-danger py-2" role="alert">
                新しいパスワードと確認用パスワードが一致しません。もう一度入力してください。
            </div>

            <!-- プロフィール更新フォーム（ファイル送信のため enctype="multipart/form-data" を指定） -->
            <form th:action="@{/profile/update}" method="post" enctype="multipart/form-data">

                <!-- プロフィール画像選択領域 -->
                <div class="mb-4 text-center">
                    <!-- 設定済みプロフィールの表示 -->
                    <img th:if="${user.profileImage != null}"
                         th:src="@{/uploads/{filename}(filename=${user.profileImage})}"
                         class="rounded-circle mb-2 shadow-sm"
                         style="width: 100px; height: 100px; object-fit: cover;"
                         alt="プロフィール画像">

                    <!-- 画像未設定時のデフォルト表示 -->
                    <img th:if="${user.profileImage == null}"
                         th:src="@{static//uploads/no-image.png}"
                         class="rounded-circle mb-2 shadow-sm bg-white"
                         style="width: 100px; height: 100px; object-fit: cover;"
                         alt="No Image">

                    <input class="form-control form-control-sm mt-2" type="file" name="iconFile" accept="image/*">
                    <div class="form-text small">JPEGまたはPNG画像を選択してください</div>
                </div>

                <!-- ニックネーム入力欄 -->
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">ニックネーム</label>
                    <input type="text" name="username" class="form-control bg-light" th:value="${user.username}" required>
                </div>

                <!-- 自己紹介文入力欄 -->
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">自己紹介</label>
                    <textarea name="bio" class="form-control bg-light" rows="3" placeholder="自己紹介を入力してください..." th:text="${user.bio}"></textarea>
                </div>

                <hr class="my-4">
                <h6 class="fw-bold mb-3">パスワード変更（変更する場合のみ入力）</h6>

                <!-- パスワード変更入力欄エリア -->
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">現在のパスワード</label>
                    <input type="password" name="currentPassword" class="form-control bg-light">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">新しいパスワード</label>
                    <input type="password" name="newPassword" class="form-control bg-light">
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">新しいパスワード（確認用）</label>
                    <input type="password" name="confirmPassword" class="form-control bg-light" placeholder="もう一度入力してください">
                </div>

                <!-- 更新実行ボタン -->
                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill">変更を保存する</button>
            </form>

        </div>
    </div>

    <!-- ② ユーザーの投稿・アクティビティ履歴エリア（3カラムレイアウト） -->
    <div class="row text-start">

        <!-- 1列目：立てたスレッド（トピック）一覧 -->
        <div class="col-md-4 mb-4">
            <h6 class="fw-bold mb-3 border-bottom pb-2">立てたスレッド</h6>
            <div th:if="${myTopics == null or myTopics.isEmpty()}" class="text-muted small">まだありません。</div>
            <div class="list-group shadow-sm">
                <a th:each="topic : ${myTopics}" th:href="@{/topic/{id}(id=${topic.id})}" class="list-group-item list-group-item-action p-3 border-0 border-bottom">
                    <small class="badge bg-primary mb-1" th:text="${topic.label}"></small>
                    <h6 class="mb-1 fw-bold text-dark" th:text="${topic.title}"></h6>
                </a>
            </div>
        </div>

        <!-- 2列目：返信（コメント）履歴一覧 -->
        <div class="col-md-4 mb-4">
            <h6 class="fw-bold mb-3 border-bottom pb-2">返信履歴</h6>
            <div th:if="${myPosts == null or myPosts.isEmpty()}" class="text-muted small">まだありません。</div>
            <div class="list-group shadow-sm">
                <!-- 親スレッドが存在する場合のみ表示（NullPointerException防止） -->
                <a th:each="post : ${myPosts}" th:if="${post.topic != null}" th:href="@{/topic/{id}(id=${post.topic.id})}" class="list-group-item list-group-item-action p-3 border-0 border-bottom">
                    <small class="text-primary fw-bold">Re: <span th:text="${post.topic.title}"></span></small>
                    <p class="mb-0 mt-1 small text-secondary text-truncate" th:text="${post.content}"></p>
                </a>
            </div>
        </div>

        <!-- 3列目：いいねしたスレッド一覧 -->
        <div class="col-md-4 mb-4">
            <h6 class="fw-bold mb-3 border-bottom pb-2">いいねしたスレッド</h6>
            <div th:if="${likedTopics == null or likedTopics.isEmpty()}" class="text-muted small">まだありません。</div>
            <div class="list-group shadow-sm">
                <a th:each="topic : ${likedTopics}" th:href="@{/topic/{id}(id=${topic.id})}" class="list-group-item list-group-item-action p-3 border-0 border-bottom bg-light">
                    <div class="d-flex w-100 justify-content-between mb-1">
                        <small class="fw-bold text-dark" th:text="${topic.title}"></small>
                    </div>
                    <small class="text-muted d-flex align-items-center">
                        <!-- スレッド作成者のアイコンとユーザー名 -->
                        <img th:if="${topic.user.profileImage != null}" th:src="@{/uploads/{filename}(filename=${topic.user.profileImage})}" class="rounded-circle me-1" style="width: 16px; height: 16px; object-fit: cover;">
                        <span th:text="${topic.user.username}"></span>
                    </small>
                </a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
