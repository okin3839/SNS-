<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SNS掲示板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container" style="max-width: 800px;">
        <a class="navbar-brand fw-bold" href="/">SNS掲示板</a>

        <div class="d-flex align-items-center">
            <a th:href="@{/profile}" class="text-decoration-none text-white d-flex align-items-center me-3" style="transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">

                <img th:if="${user.profileImage != null}"
                     th:src="@{/uploads/{filename}(filename=${user.profileImage})}"
                     class="rounded-circle me-2 shadow-sm bg-white"
                     style="width: 32px; height: 32px; object-fit: cover;"
                     alt="アイコン">

                <img th:if="${user.profileImage == null}"
                     th:src="@{/default-icon.png}"
                     class="rounded-circle me-2 shadow-sm bg-white"
                     style="width: 32px; height: 32px; object-fit: cover;"
                     alt="No Image">

                <span th:text="${user.username} + ' さん'" class="fw-bold small"></span>
            </a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light fw-bold">ログアウト</button>
            </form>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 600px;">

    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/post}" method="post">
                <div class="mb-3">
                    <input type="text" name="content" class="form-control form-control-lg bg-light" placeholder="今何してる？" required>
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-primary fw-bold px-4 rounded-pill">投稿する</button>
                </div>
            </form>
        </div>
    </div>

    <div th:each="post : ${posts}" class="card mb-3">
        <div class="card-body">
            <div class="d-flex align-items-center mb-2">
                <img th:if="${post.user.profileImage != null}"
                     th:src="@{/uploads/{filename}(filename=${post.user.profileImage})}"
                     class="rounded-circle me-2"
                     style="width: 30px; height: 30px; object-fit: cover;"
                     alt="アイコン">

                <img th:if="${post.user.profileImage == null}"
                     th:src="@{/default-icon.png}"
                     class="rounded-circle me-2"
                     style="width: 30px; height: 30px; object-fit: cover;"
                     alt="No Image">

                <h6 class="card-title m-0 fw-bold" th:text="${post.user.username}">ユーザー名</h6>
            </div>

            <p class="card-text" th:text="${post.content}">投稿内容</p>
            <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'yyyy/MM/dd HH:mm')}">時間</small>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
