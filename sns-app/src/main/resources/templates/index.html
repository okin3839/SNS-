<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SNS掲示板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container" style="max-width: 800px;">
        <a class="navbar-brand fw-bold" href="/">SNS掲示板</a>

        <div class="d-flex align-items-center">
            <a th:href="@{/profile}" class="text-decoration-none text-white d-flex align-items-center me-3" style="transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">

                <img th:if="${user.profileImage != null}"
                     th:src="@{/uploads/{filename}(filename=${user.profileImage})}"
                     class="rounded-circle me-2 shadow-sm bg-white"
                     style="width: 32px; height: 32px; object-fit: cover;"
                     alt="アイコン">

                <img th:if="${user.profileImage == null}"
                     th:src="@{/default-icon.png}"
                     class="rounded-circle me-2 shadow-sm bg-white"
                     style="width: 32px; height: 32px; object-fit: cover;"
                     alt="No Image">

                <span th:text="${user.username} + ' さん'" class="fw-bold small"></span>
            </a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light fw-bold">ログアウト</button>
            </form>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 600px; padding-bottom: 100px;">

    <h5 class="fw-bold mb-3 mt-2">スレッド一覧</h5>

    <div th:each="topic : ${topics}" class="card mb-3 shadow-sm border-0 position-relative" style="transition: transform 0.2s; cursor: pointer;" onmouseover="this.style.transform='scale(1.01)'" onmouseout="this.style.transform='scale(1)'">
        <div class="card-body">
            <div class="d-flex align-items-center mb-2" style="position: relative; z-index: 2;">
                <span class="badge bg-primary me-2" th:text="${topic.label}">ラベル</span>
                <small class="text-muted" th:text="${#temporals.format(topic.createdAt, 'yyyy/MM/dd HH:mm')}">時間</small>
            </div>

            <h5 class="card-title fw-bold mb-3">
                <a th:href="@{/topic/{id}(id=${topic.id})}" class="text-decoration-none text-dark stretched-link" th:text="${topic.title}">スレッドタイトル</a>
            </h5>

            <div class="d-flex align-items-center" style="position: relative; z-index: 2;">
                <img th:if="${topic.user.profileImage != null}"
                     th:src="@{/uploads/{filename}(filename=${topic.user.profileImage})}"
                     class="rounded-circle me-2"
                     style="width: 24px; height: 24px; object-fit: cover;"
                     alt="アイコン">

                <img th:if="${topic.user.profileImage == null}"
                     th:src="@{/default-icon.png}"
                     class="rounded-circle me-2"
                     style="width: 24px; height: 24px; object-fit: cover;"
                     alt="No Image">

                <small class="fw-bold text-muted" th:text="${topic.user.username}">ユーザー名</small>
            </div>
        </div>
    </div>

</div>

<a href="/topic/new" class="btn btn-primary shadow-lg d-flex align-items-center justify-content-center"
   style="position: fixed; bottom: 40px; right: 40px; width: 65px; height: 65px; border-radius: 50%; z-index: 1000; text-decoration: none;">
    <span style="font-size: 35px; line-height: 1; padding-bottom: 4px;">+</span>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
