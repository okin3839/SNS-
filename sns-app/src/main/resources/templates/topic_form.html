<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ページタイトル -->
    <title>新規スレッド作成 - SNS掲示板</title>
    <!-- Bootstrap 5 CSS の読み込み -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 上部ナビゲーションバー -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container" style="max-width: 600px;">
        <a class="navbar-brand fw-bold" href="/">SNS掲示板</a>
        <a href="/" class="btn btn-sm btn-outline-light">戻る</a>
    </div>
</nav>

<!-- メインコンテンツ領域 -->
<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4 fw-bold">新しいスレッドを立てる</h4>

            <!-- スレッド作成フォーム（/topic/create へ POST 送信） -->
            <form th:action="@{/topic/create}" method="post">

                <!-- 目的（カテゴリ）選択セレクトボックス -->
                <div class="mb-3">
                    <label class="form-label fw-bold">スレッドの目的（ラベル）</label>
                    <select name="label" class="form-select bg-light" required>
                        <option value="" selected disabled>選択してください</option>
                        <option value="質問・相談">質問・相談</option>
                        <option value="議論・考察">議論・考察</option>
                        <option value="共有・報告">共有・報告</option>
                        <option value="雑談">雑談</option>
                    </select>
                </div>

                <!-- スレッドタイトル入力欄 -->
                <div class="mb-3">
                    <label class="form-label fw-bold">スレッドのタイトル</label>
                    <input type="text" name="title" class="form-control bg-light" placeholder="タイトル名を書いてください..." required>
                </div>

                <!-- スレッド本文入力欄 -->
                <div class="mb-4">
                    <label class="form-label fw-bold">最初のコメント（本文）</label>
                    <textarea name="content" class="form-control bg-light" rows="5" placeholder="詳細を書いてください..." required></textarea>
                </div>

                <!-- 作成実行ボタン -->
                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill">スレッドを作成する</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
