<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${topic.title} + ' - SNS掲示板'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container" style="max-width: 800px;">
        <a class="navbar-brand fw-bold" href="/">SNS掲示板</a>
        <a href="/" class="btn btn-sm btn-outline-light fw-bold">一覧に戻る</a>
    </div>
</nav>

<div class="container" style="max-width: 700px; padding-bottom: 60px;">

    <div class="card shadow-sm border-0 mb-4 bg-white">
        <div class="card-body p-4">
            <div class="d-flex align-items-center mb-3">
                <span class="badge bg-primary me-2" th:text="${topic.label}">ラベル</span>
                <small class="text-muted" th:text="${#temporals.format(topic.createdAt, 'yyyy/MM/dd HH:mm')}">日時</small>
            </div>

            <h3 class="fw-bold mb-4" th:text="${topic.title}">スレッドタイトル</h3>

            <p class="card-text fs-5 text-dark" style="white-space: pre-wrap;" th:text="${topic.content}">最初のコメント</p>

            <hr class="text-muted my-3">

            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <img th:if="${topic.user.profileImage != null}" th:src="@{/uploads/{f}(f=${topic.user.profileImage})}" class="rounded-circle me-2" style="width: 32px; height: 32px; object-fit: cover;">
                    <img th:if="${topic.user.profileImage == null}" th:src="@{/default-icon.png}" class="rounded-circle me-2" style="width: 32px; height: 32px; object-fit: cover;">
                    <span class="fw-bold text-secondary" th:text="${topic.user.username}">スレ主</span>
                </div>

                <form th:if="${user != null and topic.user.username == user.username}"
                      th:action="@{/topic/{id}/delete(id=${topic.id})}"
                      method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-danger fw-bold px-3 rounded-pill"
                            onclick="return confirm('このスレッドを削除すると、中の返信もすべて消去されます。本当に削除しますか？');">
                        スレッドを削除
                    </button>
                </form>
            </div>
        </div>
    </div>

    <h6 class="fw-bold text-secondary mb-3">返信一覧 (<span th:text="${topic.posts.size()}">0</span>)</h6>

    <div th:if="${topic.posts.isEmpty()}" class="text-center py-4 text-muted">
        まだ返信はありません。最初の返信を投稿してみましょう！
    </div>

    <div th:each="post, stat : ${topic.posts}" class="card shadow-sm border-0 mb-2">
        <div class="card-body p-3">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <div class="d-flex align-items-center">
                    <img th:if="${post.user.profileImage != null}" th:src="@{/uploads/{f}(f=${post.user.profileImage})}" class="rounded-circle me-2" style="width: 24px; height: 24px; object-fit: cover;">
                    <img th:if="${post.user.profileImage == null}" th:src="@{/default-icon.png}" class="rounded-circle me-2" style="width: 24px; height: 24px; object-fit: cover;">
                    <small class="fw-bold text-dark" th:text="${post.user.username}">返信者ユーザー名</small>
                </div>

                <div class="d-flex align-items-center">
                    <small class="text-muted me-3" th:text="${stat.count} + '番目 · ' + ${#temporals.format(post.createdAt, 'MM/dd HH:mm')}">番号・時間</small>

                    <form th:if="${user != null and post.user.username == user.username}"
                          th:action="@{/topic/{topicId}/post/{postId}/delete(topicId=${topic.id}, postId=${post.id})}"
                          method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-danger" style="padding: 0.1rem 0.4rem; font-size: 0.8rem;" onclick="return confirm('本当に削除しますか？');">削除</button>
                    </form>
                </div>
            </div>
            <p class="card-text text-secondary m-0" style="white-space: pre-wrap;" th:text="${post.content}">返信内容</p>
        </div>
    </div>

    <div class="card shadow-sm border-0 mt-4">
        <div class="card-body p-4">
            <h6 class="fw-bold mb-3">このスレッドに返信する</h6>
            <form th:action="@{/topic/{id}/reply(id=${topic.id})}" method="post">
                <div class="mb-3">
                    <textarea name="content" class="form-control bg-light" rows="3" placeholder="コメントを入力してください..." required></textarea>
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-primary fw-bold px-4 rounded-pill">返信する</button>
                </div>
            </form>
        </div>
    </div>

</div>

</body>
</html>
